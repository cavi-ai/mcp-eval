[package]
name = "mcpeval"
version = "0.1.0"
edition = "2021"
authors = ["Sasan Sotoodehfar"]
description = "Privacy-preserving MCP friction capture and evaluation"
license = "MIT"
repository = "https://github.com/cavi-ai/mcp-eval"
readme = "README.md"
keywords = ["mcp", "evaluation", "observability", "privacy"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
psl2 = "0.1"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["poll"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

[lib]
name = "mcpeval"
path = "src/lib.rs"

[[bin]]
name = "mcpeval"
path = "src/main.rs"
