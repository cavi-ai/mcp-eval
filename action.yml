name: 'mcp-eval probe'
description: >
  Run the mcp-eval deterministic probe battery against an MCP server and fail
  the workflow when any selected case fails. Installs the checksum-verified
  release pinned by this action's distribution/release.json (or uses a
  preinstalled binary), writes the report to the job summary, and exposes the
  verdict as step outputs.
author: 'CAVI'

inputs:
  server:
    description: 'Server label recorded in reports and journals.'
    required: true
  manifest:
    description: 'Path to mcp-eval.manifest.json.'
    required: false
    default: 'mcp-eval.manifest.json'
  command:
    description: >
      stdio server command to probe. Either whitespace-separated words, e.g.
      "python3 server.py --flag" (no quoting), or a JSON array of strings,
      e.g. '["python3", "my server.py"]', for arguments containing spaces.
      Leave empty when `url` is set.
    required: false
    default: ''
  url:
    description: 'Streamable HTTP endpoint to probe instead of a stdio command.'
    required: false
    default: ''
  allow-mutation:
    description: "Authorize manifest-declared sandbox mutations ('true'/'false')."
    required: false
    default: 'false'
  allow-remote-http:
    description: "Allow a remote HTTPS endpoint ('true'/'false')."
    required: false
    default: 'false'
  version:
    description: >
      Release to install instead of the one pinned by this action's
      distribution/release.json, e.g. "0.2.0". The archive is verified against
      that release's own release.json. A preinstalled `mcpeval` is reused
      only when its version matches this input.
    required: false
    default: ''
  baseline:
    description: >
      Committed mcpeval.probe-report (v1 or v2) baseline. When set, the run fails on
      any case that regressed against it.
    required: false
    default: ''
  fail-on-change:
    description: "With `baseline`, also fail on changed failure reasons ('true'/'false')."
    required: false
    default: 'false'
  fail-on-breaking:
    description: >
      With `baseline`, also fail on catalog contract changes that break
      callers ('true'/'false').
    required: false
    default: 'false'
  min-readiness:
    description: 'Fail when readiness is under this score (0-100).'
    required: false
    default: ''
  min-area:
    description: >
      Area floors as whitespace-separated AREA=SCORE words, e.g.
      "error-honesty=90 reliability=80". Fails when an area scores under its
      floor.
    required: false
    default: ''
  max-readiness-drop:
    description: >
      With `baseline`, fail when readiness fell by more than this many points.
    required: false
    default: ''
  exclude-latency:
    description: >
      Compare readiness floors and the readiness drop with every latency check
      at full marks ('true'/'false'); latency depends on the runner.
    required: false
    default: 'false'
  sarif:
    description: >
      Render the report as SARIF and upload it to code scanning
      ('true'/'false'). The job needs `security-events: write`.
    required: false
    default: 'false'
  report-path:
    description: >
      Where to write the JSON report. The markdown and SARIF renderings are
      written beside it.
    required: false
    default: 'mcpeval.report.json'
  comment:
    description: >
      On pull_request events, keep one comment per server on the pull request
      with the rendered report and baseline diff, edited in place on later
      runs ('true'/'false'). The job needs `pull-requests: write`.
    required: false
    default: 'false'
  github-token:
    description: 'Token used to write the pull-request comment.'
    required: false
    default: ${{ github.token }}
  artifact:
    description: >
      Upload the JSON report, its markdown, and the SARIF document as the
      workflow artifact `mcpeval-<server>`; the JSON report is the candidate
      for the next committed baseline ('true'/'false').
    required: false
    default: 'false'

outputs:
  passed:
    description: "'true' when every selected case passed and every readiness floor held."
    value: ${{ steps.run.outputs.passed }}
  readiness:
    description: 'Readiness score (0-100) under the mcpeval standard the report names.'
    value: ${{ steps.run.outputs.readiness }}
  report:
    description: 'Path to the JSON report.'
    value: ${{ steps.run.outputs.report }}
  markdown:
    description: 'Path to the rendered markdown report (and baseline diff, when `baseline` is set).'
    value: ${{ steps.run.outputs.markdown }}
  exit-code:
    description: 'Exit code of mcpeval probe.'
    value: ${{ steps.run.outputs.exit-code }}
  diff-exit-code:
    description: 'Exit code of mcpeval diff against `baseline`.'
    value: ${{ steps.run.outputs.diff-exit-code }}
  sarif:
    description: 'Path to the SARIF document when `sarif` is true.'
    value: ${{ steps.run.outputs.sarif }}

runs:
  using: composite
  steps:
    - name: Install mcpeval
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        MCPEVAL_VERSION: ${{ inputs.version }}
      run: bash "$ACTION_PATH/scripts/action/install.sh"
    - name: Run probe battery
      id: run
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_SERVER: ${{ inputs.server }}
        INPUT_MANIFEST: ${{ inputs.manifest }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_ALLOW_MUTATION: ${{ inputs.allow-mutation }}
        INPUT_ALLOW_REMOTE_HTTP: ${{ inputs.allow-remote-http }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_FAIL_ON_CHANGE: ${{ inputs.fail-on-change }}
        INPUT_FAIL_ON_BREAKING: ${{ inputs.fail-on-breaking }}
        INPUT_MIN_READINESS: ${{ inputs.min-readiness }}
        INPUT_MIN_AREA: ${{ inputs.min-area }}
        INPUT_MAX_READINESS_DROP: ${{ inputs.max-readiness-drop }}
        INPUT_EXCLUDE_LATENCY: ${{ inputs.exclude-latency }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_REPORT_PATH: ${{ inputs.report-path }}
      run: bash "$ACTION_PATH/scripts/action/run.sh"
    - name: Upload SARIF to code scanning
      if: ${{ !cancelled() && inputs.sarif == 'true' && steps.run.outputs.sarif != '' }}
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        sarif_file: ${{ steps.run.outputs.sarif }}
    - name: Comment on the pull request
      if: ${{ !cancelled() && inputs.comment == 'true' && github.event_name == 'pull_request' && steps.run.outputs.markdown != '' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_SERVER: ${{ inputs.server }}
        MARKDOWN: ${{ steps.run.outputs.markdown }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: bash "$ACTION_PATH/scripts/action/comment.sh"
    - name: Upload the report artifact
      if: ${{ !cancelled() && inputs.artifact == 'true' && steps.run.outputs.report != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: mcpeval-${{ inputs.server }}
        path: |
          ${{ steps.run.outputs.report }}
          ${{ steps.run.outputs.markdown }}
          ${{ steps.run.outputs.sarif }}
        if-no-files-found: warn
