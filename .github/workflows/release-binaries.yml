name: Release binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to attach assets to, e.g. v0.1.1
        required: false
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          # macos-13 was retired in December 2025; macos-15-intel is the
          # remaining x86_64 macOS image.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --locked --bins --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          set -euo pipefail
          cd "target/${{ matrix.target }}/release"
          # Drop debug symbols from released binaries; local cargo builds stay unstripped.
          strip mcpeval mcpeval-demo
          # Explicit argument order (binaries sorted) rather than GNU's
          # --sort=name, which BSD tar on macOS does not support.
          tar -czf "mcpeval-${{ matrix.target }}.tar.gz" mcpeval mcpeval-demo
          shasum -a 256 "mcpeval-${{ matrix.target }}.tar.gz" \
            > "mcpeval-${{ matrix.target }}.tar.gz.sha256"
          shasum -a 256 -c "mcpeval-${{ matrix.target }}.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $dir = "target/${{ matrix.target }}/release"
          Compress-Archive -Path "$dir/mcpeval.exe","$dir/mcpeval-demo.exe" -DestinationPath "$dir/mcpeval-${{ matrix.target }}.zip"
          $hash = (Get-FileHash "$dir/mcpeval-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  mcpeval-${{ matrix.target }}.zip" | Out-File -NoNewline -Encoding ascii "$dir/mcpeval-${{ matrix.target }}.zip.sha256"

      - name: Smoke release binaries --version
        shell: bash
        run: |
          set -euo pipefail
          OUT="target/${{ matrix.target }}/release"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            "$OUT/mcpeval.exe" --version
            "$OUT/mcpeval-demo.exe" --help >/dev/null || true
          else
            "$OUT/mcpeval" --version
            test -x "$OUT/mcpeval-demo"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: mcpeval-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/mcpeval-*.tar.gz
            target/${{ matrix.target }}/release/mcpeval-*.tar.gz.sha256
            target/${{ matrix.target }}/release/mcpeval-*.zip
            target/${{ matrix.target }}/release/mcpeval-*.zip.sha256
          if-no-files-found: error

  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' }}
    runs-on: ubuntu-latest
    # Uploading assets needs write here even though the workflow already
    # declares it, matching publish-docs.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The distribution manifest records the tag's commit.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Nothing else creates the release. `gh release upload` answers "release
      # not found" and fails the tag otherwise. `publish-docs` also refuses to
      # run without a published, non-prerelease release, and `publish` (npm)
      # waits for the manifest this job attaches, so this step gates the tag.
      - name: Create the GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; leaving its body untouched"
            exit 0
          fi
          # Fails when the version has no changelog section, so a tag can never
          # publish a release with an empty body.
          python3 scripts/changelog-section.py "$VERSION" > notes.md
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file notes.md \
            --verify-tag

      # Idempotent, never --clobber: the npm package and the Homebrew formula
      # pin these archives by SHA-256, so an asset that already exists must be
      # byte-identical or the run refuses to touch it.
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::no built assets to upload"
            exit 1
          fi
          for file in dist/mcpeval-*; do
            name="$(basename "$file")"
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --output "$RUNNER_TEMP/existing-$name" 2>/dev/null; then
              existing="$(sha256sum "$RUNNER_TEMP/existing-$name" | cut -d' ' -f1)"
              local_hash="$(sha256sum "$file" | cut -d' ' -f1)"
              if [[ "$existing" != "$local_hash" ]]; then
                echo "::error::Release asset $name already exists with different bytes; refusing overwrite"
                exit 1
              fi
              echo "$name already attached with identical bytes"
            else
              gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
            fi
          done

      # distribution/release.json is what the npm package and the Homebrew
      # formula pin: archive names, sizes, and SHA-256 digests of the assets
      # attached above, with the tag and its commit. It is generated from the
      # built bytes here and attached to the release, where `publish` (npm)
      # collects it and the post-release pull request refreshes the committed
      # copy from.
      - name: Publish the distribution manifest and formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          COMMIT="$(git rev-list -n 1 "$TAG")"
          node scripts/distribution/release-manifest.mjs --dist dist --tag "$TAG" --commit "$COMMIT" > "$RUNNER_TEMP/release.json"
          node scripts/distribution/render-formula.mjs --manifest "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/mcpeval.rb"
          for name in release.json mcpeval.rb; do
            file="$RUNNER_TEMP/$name"
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --output "$RUNNER_TEMP/existing-$name" 2>/dev/null; then
              if ! cmp --silent "$RUNNER_TEMP/existing-$name" "$file"; then
                echo "::error::Release asset $name already exists with different bytes; refusing overwrite"
                exit 1
              fi
              echo "$name already attached with identical bytes"
            else
              gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
            fi
          done
          cat "$RUNNER_TEMP/release.json"

  # A release created with GITHUB_TOKEN does not fire `on: release`, so the
  # documentation artifact is invoked directly rather than left to the event.
  docs:
    needs: release
    # A called workflow can only use permissions the caller grants: its
    # `release` job writes release assets, its `site` job deploys Pages.
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-docs.yml
    with:
      version: ${{ needs.release.outputs.version }}
      dry_run: false
    secrets: inherit
