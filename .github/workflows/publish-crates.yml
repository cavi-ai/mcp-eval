name: Publish crates

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build installable binary
        run: cargo build --release --locked

      - name: Verify every artifact carries one version
        run: |
          set -euo pipefail
          python3 scripts/check-version-agreement.py

      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          CRATE_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "${GITHUB_REF_NAME#v}" = "$CRATE_VERSION"

      # Pre-flight on every trigger, including workflow_dispatch, so a broken
      # manifest is caught without claiming a name on crates.io.
      - name: Dry-run publish
        run: |
          set -euo pipefail
          cargo publish --dry-run --locked

      # Only on a version tag. `workflow_dispatch` stops at the dry run, so the
      # manual trigger stays a safe rehearsal — publishing to crates.io is
      # irreversible and a name cannot be reclaimed. A re-run of a published
      # tag exits cleanly instead of failing on the duplicate.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if curl -fsS -A "mcp-eval release automation (github.com/cavi-ai/mcp-eval)" \
              "https://crates.io/api/v1/crates/mcpeval/${VERSION}" >/dev/null 2>&1; then
            echo "mcpeval ${VERSION} already on crates.io"
            exit 0
          fi
          cargo publish --locked
