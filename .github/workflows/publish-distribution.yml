name: Publish distribution

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      dry_run:
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag (vX.Y.Z)
        required: true
        type: string
      dry_run:
        description: Verify the release files and a Homebrew install without publishing
        default: true
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: distribution-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag }}
      RELEASE_ROOT: release-source
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Check out workflow tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: ${{ env.RELEASE_ROOT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1

      - name: Take the release's manifest and formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern release.json --output "$RELEASE_ROOT/distribution/release.json" --clobber
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern mcpeval.rb --output "$RELEASE_ROOT/Formula/mcpeval.rb" --clobber

      - name: Verify the files against the published archives
        run: node scripts/distribution/verify.mjs --root "$RELEASE_ROOT" --online --strict

      - name: Install and test the formula through Homebrew
        run: |
          set -euo pipefail
          brew tap-new --no-git cavi-ai/mcpeval-release
          cp "$RELEASE_ROOT/Formula/mcpeval.rb" "$(brew --repository cavi-ai/mcpeval-release)/Formula/mcpeval.rb"
          brew trust --formula cavi-ai/mcpeval-release/mcpeval
          brew install cavi-ai/mcpeval-release/mcpeval
          brew test cavi-ai/mcpeval-release/mcpeval
          test "$(mcpeval --version)" = "mcpeval ${TAG#v}"

      - name: Plan the distribution and tap pull requests
        if: ${{ inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/distribution/publish-pins.mjs --root "$RELEASE_ROOT" --tag "$TAG" --dry-run

      - name: Merge the distribution and tap pull requests
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.CONSUMER_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN or CONSUMER_DISPATCH_TOKEN must allow contents and pull-request writes in mcp-eval and homebrew-tap"
            exit 1
          fi
          node scripts/distribution/publish-pins.mjs --root "$RELEASE_ROOT" --tag "$TAG"
