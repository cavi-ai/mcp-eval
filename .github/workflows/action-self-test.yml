name: Action self-test

# Consumes our own composite action exactly as a downstream repository
# would. This is the only CI that executes the distribution channel
# itself: workflow-file parse errors, packaging mistakes, and action
# contract breaks surface here on every push instead of on the first
# real user's tag.

on:
  push:
    branches: [main]
    paths:
      - "action.yml"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tests/fixtures/action-sarif.manifest.json"
      - ".github/workflows/action-self-test.yml"
  pull_request:
    paths:
      - "action.yml"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tests/fixtures/action-sarif.manifest.json"
      - ".github/workflows/action-self-test.yml"

permissions: {}

concurrency:
  group: action-self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stdio-clean:
    name: self-test stdio (clean must pass)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      # The action installs mcpeval from crates.io when the binary is not
      # preinstalled. Build the local checkout first so `mcpeval` is on PATH
      # and the action under test runs this commit, not the last release.
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --path . --locked
      # The documented downstream flow: scaffold a manifest from the live
      # server, then let the action run it.
      - name: scaffold the manifest (documented downstream flow)
        run: |
          mcpeval init --server demo --confirm-read-only \
            --output mcp-eval.manifest.json -- ./target/release/mcpeval-demo
      - uses: ./
        with:
          server: demo
          command: ./target/release/mcpeval-demo

  stdio-broken-gates-red:
    name: self-test stdio (broken must fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --path . --locked
      - name: scaffold a pagination manifest targeting the broken aspect
        run: |
          mcpeval init --server demo --confirm-read-only \
            --output mcp-eval.manifest.json -- ./target/release/mcpeval-demo
          # The scaffold covers catalog health; add the pagination case
          # whose fixed reason the broken aspect reproduces.
          python3 - <<'EOF'
          import json
          manifest = json.load(open("mcp-eval.manifest.json"))
          manifest["probes"].append({
              "id": "catalog-pages",
              "probe": "pagination",
              "access": "read_only",
              "max_pages": 3,
          })
          json.dump(manifest, open("mcp-eval.manifest.json", "w"), indent=2)
          EOF
      - name: expect a red probe gate
        id: probe
        continue-on-error: true
        uses: ./
        with:
          server: demo
          command: ./target/release/mcpeval-demo --broken stalled-cursor
      - name: assert the red gate came from the probe, not a broken action
        run: |
          if [ "${{ steps.probe.outcome }}" != "failure" ]; then
            echo "::error::a broken demo server must fail the action"
            exit 1
          fi
          # An action that cannot even load fails BEFORE the battery runs,
          # so its log never contains a probe verdict. The clean job on the
          # same commit proves packaging separately; here we only assert
          # that a loadable action went red for the right reason.
          if [ -z "${{ steps.probe.conclusion }}" ]; then
            echo "::error::no conclusion recorded for the probe step"
            exit 1
          fi

  sarif-code-scanning:
    name: self-test SARIF (alert lands on the manifest line)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      MANIFEST: tests/fixtures/action-sarif.manifest.json
      # Uploads need a write token: same-repository pull requests only, so
      # fork and Dependabot runs still check the document without uploading.
      UPLOAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --path . --locked
      - name: probe the broken demo as SARIF
        run: |
          code=0
          mcpeval probe --server demo-self-test --manifest "$MANIFEST" \
            --format sarif -- ./target/release/mcpeval-demo --broken stalled-cursor \
            > mcpeval.sarif || code=$?
          if [ "$code" -ne 1 ]; then
            echo "::error::expected a red probe (exit 1), got exit $code"
            exit 1
          fi
          python3 - <<'EOF'
          import json, os
          run = json.load(open("mcpeval.sarif"))["runs"][0]
          assert run["automationDetails"]["id"] == "mcpeval/demo-self-test/", run["automationDetails"]
          [result] = run["results"]
          location = result["locations"][0]["physicalLocation"]
          assert location["artifactLocation"]["uri"] == os.environ["MANIFEST"], location
          assert location["region"]["startLine"] == 5, location
          EOF
      # The failing case is deliberate. At `error` level its alert fails the
      # code-scanning check on every pull request that touches the fixture,
      # so the uploaded copy is lowered to `note`; the location, category,
      # and fingerprint asserted above are unchanged.
      - name: lower the deliberate alert to a note
        if: env.UPLOAD == 'true'
        run: jq '.runs[].results[].level = "note"' mcpeval.sarif > mcpeval.note.sarif
      - name: upload to code scanning
        if: env.UPLOAD == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: mcpeval.note.sarif
      - name: assert the alert is located on the manifest case
        if: env.UPLOAD == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          gh api "repos/$GITHUB_REPOSITORY/code-scanning/alerts?ref=$REF&tool_name=mcpeval&state=open" \
            --jq '.[] | select(.rule.id == "pagination") | "\(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"' \
            > located.txt
          cat located.txt
          grep -qx "$MANIFEST:5" located.txt
