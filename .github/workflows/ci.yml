name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: Checks
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Distribution verification reads the published release tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA" HEAD

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1

      - name: Set up Rust from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Version, format, and lint
        run: |
          python3 scripts/check-version-agreement.py
          cargo fmt --all --check
          cargo clippy --all-targets --locked

      - name: Rust tests
        # Keep native timing measurements isolated from other fixtures.
        run: cargo test --all-targets --locked -- --test-threads=1

      - name: Docs, action, corpus, and distribution contracts
        env:
          MCPEVAL_TEST_BIN_DIR: target/debug
          MCPEVAL_CORPUS_TEST_BINARY: target/debug/mcpeval
        run: |
          npm run docs:build
          npm run docs:verify
          npm run docs:test
          npm run test:action
          npm run test:corpus
          npm run test:distribution
          npm run verify:distribution

      - name: Reuse the tested binaries in the composite action
        run: echo "$GITHUB_WORKSPACE/target/debug" >>"$GITHUB_PATH"

      - name: Run the composite action against a clean server
        id: clean
        uses: ./
        with:
          server: demo
          manifest: tests/fixtures/action-sarif.manifest.json
          command: mcpeval-demo
          report-path: mcpeval.baseline.json

      - name: Catch a regression against the clean baseline
        id: regression
        continue-on-error: true
        uses: ./
        with:
          server: demo
          manifest: tests/fixtures/action-sarif.manifest.json
          command: mcpeval-demo --broken stalled-cursor
          baseline: ${{ steps.clean.outputs.report }}

      - name: Check the composite action verdicts
        env:
          CLEAN_PASSED: ${{ steps.clean.outputs.passed }}
          CLEAN_REPORT: ${{ steps.clean.outputs.report }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          DIFF_EXIT: ${{ steps.regression.outputs.diff-exit-code }}
        run: |
          test "$CLEAN_PASSED" = true
          jq -e '.schema == "mcpeval.probe-report/v2" and .passed' "$CLEAN_REPORT"
          test "$REGRESSION_OUTCOME" = failure
          test "$DIFF_EXIT" = 1
