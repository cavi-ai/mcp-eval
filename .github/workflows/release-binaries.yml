name: Release binaries

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  gate:
    name: gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Python for fixture servers
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"
      - name: rustfmt
        run: cargo fmt -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: tests
        run: cargo test --all-targets

  binaries:
    name: build ${{ matrix.target }}
    needs: gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --bins --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd "target/${{ matrix.target }}/release"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -czf "mcpeval-${{ matrix.target }}.tar.gz" mcpeval mcpeval-demo
          shasum -a 256 "mcpeval-${{ matrix.target }}.tar.gz" \
            > "mcpeval-${{ matrix.target }}.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $dir = "target/${{ matrix.target }}/release"
          Compress-Archive -Path "$dir/mcpeval.exe","$dir/mcpeval-demo.exe" -DestinationPath "$dir/mcpeval-${{ matrix.target }}.zip"
          $hash = (Get-FileHash "$dir/mcpeval-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  mcpeval-${{ matrix.target }}.zip" | Out-File -NoNewline -Encoding ascii "$dir/mcpeval-${{ matrix.target }}.zip.sha256"

      - name: Verify checksum file (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd "target/${{ matrix.target }}/release"
          shasum -a 256 -c "mcpeval-${{ matrix.target }}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcpeval-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/mcpeval-*
          if-no-files-found: error

  publish:
    name: publish release assets
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Download all archives
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          path: dist
          merge-multiple: true

      - name: Publish binaries to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Idempotent: re-running an existing release must not mutate assets.
          for file in dist/mcpeval-*; do
            name="$(basename "$file")"
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --output "/tmp/existing-$name" 2>/dev/null; then
              existing="$(sha256sum "/tmp/existing-$name" | cut -d' ' -f1)"
              local_hash="$(sha256sum "$file" | cut -d' ' -f1)"
              if [[ "$existing" != "$local_hash" ]]; then
                echo "::error::Release asset $name already exists with different bytes; refusing overwrite"
                exit 1
              fi
              echo "$name already attached with identical bytes"
            else
              gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber
            fi
          done

      - name: Publish crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if cargo search mcpeval --limit 1 2>/dev/null | grep -q '^mcpeval = "'; then
            published="$(cargo search mcpeval --limit 1 | grep '^mcpeval = "' | cut -d'"' -f2)"
            if [[ "$published" == "${GITHUB_REF_NAME#v}" ]]; then
              echo "mcpeval ${GITHUB_REF_NAME#v} already on crates.io"
              exit 0
            fi
          fi
          cargo publish --locked