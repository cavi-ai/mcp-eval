name: Publish product documentation

on:
  release:
    types: [published]
  # Called by `release-binaries` once the release exists: a release created with
  # GITHUB_TOKEN does not fire `on: release`, so the tag path invokes this
  # directly instead of waiting for an event that never arrives.
  workflow_call:
    inputs:
      version:
        description: Exact stable version to publish
        required: true
        type: string
      dry_run:
        description: Build and verify without upload or dispatch
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable version to verify or backfill (defaults to the Cargo package version)
        required: false
        type: string
      dry_run:
        description: Build and verify without upload or dispatch
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions: {}

concurrency:
  # Both trigger paths key on the tag, so a manually published release and the
  # workflow_call from release-binaries serialize instead of racing the upload.
  group: publish-docs-${{ github.event_name == 'release' && github.event.release.tag_name || (inputs.version && format('v{0}', inputs.version)) || 'package' }}
  cancel-in-progress: false

jobs:
  docs:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1

      - name: Resolve release identity
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_VERSION="$(node --input-type=module -e 'import { DOCUMENTED_VERSION } from "./scripts/docs/lib.mjs"; console.log(DOCUMENTED_VERSION)')"
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            TAG="$EVENT_TAG"
            VERSION="${TAG#v}"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
            TAG="v${VERSION}"
          else
            VERSION="$PACKAGE_VERSION"
            TAG="v${VERSION}"
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::documentation releases require an exact v-prefixed stable version"
            exit 1
          fi
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::requested version ${VERSION} does not match package sources of truth ${PACKAGE_VERSION}"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            COMMIT="$(git rev-list -n 1 "$TAG")"
          else
            COMMIT="$(git rev-parse HEAD)"
          fi
          EPOCH="$(git show -s --format=%ct "$COMMIT")"
          if [[ ! "$COMMIT" =~ ^[a-f0-9]{40}$ ]] || [[ ! "$EPOCH" =~ ^[0-9]+$ ]]; then
            echo "::error::release identity does not resolve to immutable provenance"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "commit=$COMMIT"
            echo "epoch=$EPOCH"
          } >> "$GITHUB_OUTPUT"

      - name: Build, verify, and package deterministic documentation
        id: artifact
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
          EPOCH: ${{ steps.release.outputs.epoch }}
        run: |
          node scripts/docs/build.mjs --version "$VERSION" --tag "$TAG" --commit "$COMMIT" --source-date-epoch "$EPOCH"
          node scripts/docs/verify.mjs --version "$VERSION" --tag "$TAG" --commit "$COMMIT" --source-date-epoch "$EPOCH"
          OUTPUT="$RUNNER_TEMP/mcp-eval-docs-release"
          ENVELOPE="$RUNNER_TEMP/cavi-oss-release.json"
          node scripts/docs/release-artifact.mjs --docs-root "docs/mcp-eval/v${VERSION}" --output "$OUTPUT" --version "$VERSION" --tag "$TAG" --repository "$GITHUB_REPOSITORY" --commit "$COMMIT" --source-date-epoch "$EPOCH" > "$ENVELOPE"
          ARTIFACT="mcp-eval-docs-${TAG}.tar.gz"
          SHA256="$(jq -r '.artifact.sha256' "$ENVELOPE")"
          {
            echo "directory=$OUTPUT"
            echo "name=$ARTIFACT"
            echo "sha256=$SHA256"
            echo "envelope=$ENVELOPE"
          } >> "$GITHUB_OUTPUT"
          jq . "$ENVELOPE"

      - name: Upload immutable release assets
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          DIRECTORY: ${{ steps.artifact.outputs.directory }}
          ARTIFACT: ${{ steps.artifact.outputs.name }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          RELEASE_STATE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)"
          if ! printf '%s\n' "$RELEASE_STATE" | jq -e '.isDraft == false and .isPrerelease == false' >/dev/null; then
            echo "::error::documentation asset requires a published non-prerelease GitHub Release"
            exit 1
          fi
          EXISTING="$RUNNER_TEMP/existing-$ARTIFACT"
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARTIFACT" --output "$EXISTING" 2>/dev/null; then
            EXISTING_SHA="$(sha256sum "$EXISTING" | cut -d' ' -f1)"
            if [ "$EXISTING_SHA" != "$SHA256" ]; then
              echo "::error::existing release asset differs; refusing overwrite"
              exit 1
            fi
            echo "identical release asset already exists"
          else
            gh release upload "$TAG" "$DIRECTORY/$ARTIFACT" "$DIRECTORY/$ARTIFACT.sha256" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Dispatch required cavi-home ingestion
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
          ENVELOPE: ${{ steps.artifact.outputs.envelope }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::CONSUMER_DISPATCH_TOKEN is required"
            exit 1
          fi
          jq -n --argjson payload "$(cat "$ENVELOPE")" '{event_type:"cavi-oss-release",client_payload:$payload}' | gh api --method POST /repos/cavi-ai/cavi-home/dispatches --input -

  site:
    name: publish · pages · site
    if: ${{ inputs.dry_run != true && !github.event.repository.private }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: docs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1

      # Every previously released version lives in the checkout history
      # under docs/mcp-eval/v*/; re-materialize each one so the site can
      # serve all versions with the current one highlighted.
      - name: Materialize versioned documentation
        run: |
          VERSIONS="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')"
          if [ -z "$VERSIONS" ]; then
            echo "::error::no version tags found; nothing to publish"
            exit 1
          fi
          BASE="$(git rev-parse HEAD)"
          # A released version's docs must build from that release's own
          # commit, reproducing the deterministic archive byte-for-byte
          # before the site renders it.
          for TAG in $VERSIONS; do
            COMMIT="$(git rev-list -n 1 "$TAG")"
            VERSION="${TAG#v}"
            git checkout -q "$COMMIT"
            node scripts/docs/build.mjs --version "$VERSION" --tag "$TAG" --commit "$COMMIT" \
              --source-date-epoch "$(git show -s --format=%ct "$COMMIT")"
            node scripts/docs/verify.mjs --version "$VERSION" --tag "$TAG" --commit "$COMMIT" \
              --source-date-epoch "$(git show -s --format=%ct "$COMMIT")"
            git checkout -q "$BASE"
            echo "materialized v$VERSION from $COMMIT"
          done

      - name: Render the static site
        run: node scripts/docs/render-site.mjs --output site

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
