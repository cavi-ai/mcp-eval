name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust · build · test · lint
    if: ${{ !github.event.repository.private }} # public repos only (Actions is billed when private)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Python for fixture servers
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Build
        run: cargo build --all-targets --locked

      - name: Test
        # Timing budgets share this runner with the native fixture tests.
        # Serialize tests so our own workloads cannot overlap measurements.
        run: cargo test --all-targets --locked -- --test-threads=1
        timeout-minutes: 30

      - name: Build release timing tests
        run: cargo test --release --locked --test overhead --no-run
        timeout-minutes: 20

      - name: Release shim timing budgets
        run: cargo test --release --locked --test overhead -- --test-threads=1 --nocapture
        timeout-minutes: 5

      - name: Version and naming agreement
        # One tag ships binaries, npm, and the crate, so a version that
        # disagrees between manifests ships a mislabelled artifact.
        run: python3 scripts/check-version-agreement.py

  windows:
    name: windows · build · test
    # Every v* tag builds mcpeval for windows-msvc in release-binaries. Run the
    # full suite on the same OS so a cfg(windows) break lands on the PR instead
    # of the tag.
    if: ${{ !github.event.repository.private }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Python for fixture servers
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Test
        run: cargo test --all-targets --locked -- --test-threads=1
        timeout-minutes: 30

      - name: Build release timing tests
        run: cargo test --release --locked --test overhead --no-run
        timeout-minutes: 20

      - name: Release shim timing budgets
        run: cargo test --release --locked --test overhead -- --test-threads=1 --nocapture
        timeout-minutes: 5

  macos:
    name: macos · build · test
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Python for fixture servers
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Test
        run: cargo test --all-targets --locked -- --test-threads=1
        timeout-minutes: 30

      - name: Build release timing tests
        run: cargo test --release --locked --test overhead --no-run
        timeout-minutes: 20

      - name: Release shim timing budgets
        run: cargo test --release --locked --test overhead -- --test-threads=1 --nocapture
        timeout-minutes: 5

  node:
    name: node · distribution · docs
    if: ${{ !github.event.repository.private }} # public repos only (Actions is billed when private)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # verify.mjs resolves the published release tag to its commit.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # scripts/action/*.test.mjs runs run.sh and install.sh against the
      # real binaries; build them so npm run test:action exercises the
      # action end to end instead of skipping its build-gated cases.
      - name: Build action binaries
        run: cargo build --release --locked --bins

      - name: Docs artifact
        run: |
          npm run docs:build
          npm run docs:verify
          npm run docs:test
          npm run test:action
          npm run test:corpus

      - name: Prepare native corpus action fixtures
        run: node scripts/corpus/fixtures/prepare-action-evidence.mjs --out "$RUNNER_TEMP/corpus-action-fixtures"

      - name: Intact passing corpus evidence
        id: corpus-passing
        uses: ./actions/corpus-evidence
        with:
          evidence: ${{ runner.temp }}/corpus-action-fixtures/passing
          corpus: ${{ runner.temp }}/corpus-action-fixtures/corpus.json
          targets: ${{ runner.temp }}/corpus-action-fixtures/targets.json
          reports: ${{ runner.temp }}/corpus-action-fixtures/original-reports

      - name: Intact failed corpus evidence
        id: corpus-failed
        continue-on-error: true
        uses: ./actions/corpus-evidence
        with:
          evidence: ${{ runner.temp }}/corpus-action-fixtures/failed
          corpus: ${{ runner.temp }}/corpus-action-fixtures/corpus.json
          targets: ${{ runner.temp }}/corpus-action-fixtures/targets.json
          reports: ${{ runner.temp }}/corpus-action-fixtures/original-reports

      - name: Invalid corpus evidence
        id: corpus-invalid
        continue-on-error: true
        uses: ./actions/corpus-evidence
        with:
          evidence: ${{ runner.temp }}/corpus-action-fixtures/invalid
          corpus: ${{ runner.temp }}/corpus-action-fixtures/corpus.json
          targets: ${{ runner.temp }}/corpus-action-fixtures/targets.json
          reports: ${{ runner.temp }}/corpus-action-fixtures/original-reports

      - name: Assert corpus action gates and outputs
        env:
          PASS_OUTCOME: ${{ steps.corpus-passing.outcome }}
          PASS_VALID: ${{ steps.corpus-passing.outputs.evidence-valid }}
          PASS_VERDICT: ${{ steps.corpus-passing.outputs.passed }}
          PASS_CODE: ${{ steps.corpus-passing.outputs.exit-code }}
          PASS_OBSERVATIONS: ${{ steps.corpus-passing.outputs.observations }}
          PASS_POPULATION: ${{ steps.corpus-passing.outputs.population }}
          FAIL_OUTCOME: ${{ steps.corpus-failed.outcome }}
          FAIL_VALID: ${{ steps.corpus-failed.outputs.evidence-valid }}
          FAIL_VERDICT: ${{ steps.corpus-failed.outputs.passed }}
          FAIL_CODE: ${{ steps.corpus-failed.outputs.exit-code }}
          INVALID_OUTCOME: ${{ steps.corpus-invalid.outcome }}
          INVALID_VALID: ${{ steps.corpus-invalid.outputs.evidence-valid }}
          INVALID_VERDICT: ${{ steps.corpus-invalid.outputs.passed }}
          INVALID_CODE: ${{ steps.corpus-invalid.outputs.exit-code }}
          INVALID_OBSERVATIONS: ${{ steps.corpus-invalid.outputs.observations }}
          INVALID_POPULATION: ${{ steps.corpus-invalid.outputs.population }}
        run: |
          node --input-type=module -e '
          import assert from "node:assert/strict";
          const env = process.env;
          for (const [key, expected] of Object.entries({
            PASS_OUTCOME: "success", PASS_VALID: "true", PASS_VERDICT: "true", PASS_CODE: "0", PASS_OBSERVATIONS: "1", PASS_POPULATION: "1",
            FAIL_OUTCOME: "failure", FAIL_VALID: "true", FAIL_VERDICT: "false", FAIL_CODE: "1",
            INVALID_OUTCOME: "failure", INVALID_VALID: "false", INVALID_VERDICT: "false", INVALID_CODE: "2", INVALID_OBSERVATIONS: "", INVALID_POPULATION: "",
          })) assert.equal(env[key], expected, key);
          '

      - name: Distribution contract
        run: |
          npm run test:distribution
          npm run verify:distribution
          npm pack --dry-run --ignore-scripts

  npm-install:
    name: npm install (${{ matrix.os }})
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1

      - run: node scripts/distribution/package-e2e.mjs

  homebrew-install:
    name: homebrew · audit · install
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Stage local tap
        run: |
          brew tap-new --no-git cavi-ai/mcpeval-ci
          tap_root="$(brew --repository cavi-ai/mcpeval-ci)"
          cp Formula/mcpeval.rb "$tap_root/Formula/mcpeval.rb"

      - run: brew audit --strict cavi-ai/mcpeval-ci/mcpeval
      - run: brew install cavi-ai/mcpeval-ci/mcpeval
      - run: brew test cavi-ai/mcpeval-ci/mcpeval

      - name: Clean up local tap
        if: always()
        run: |
          brew uninstall --force mcpeval || true
          brew untap --force cavi-ai/mcpeval-ci || true

  whitespace:
    name: git diff --check
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: git diff --check HEAD~1
        if: github.event_name == 'push'

      - run: git diff --check origin/${{ github.base_ref }}...HEAD
        if: github.event_name == 'pull_request'
